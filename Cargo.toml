[workspace]
resolver = "2"
members = [
    "crates/erwuzai-core",
    "crates/erwuzai-store",
    "crates/erwuzai-platform",
    "crates/erwuzai-ui",
]

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
redb = "4"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
