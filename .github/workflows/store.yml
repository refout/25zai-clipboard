name: store

# 手动触发：构建 MSIX、用自签证书签名，产物作为 artifact 下载后上传 Partner Center。
# 微软会用自家证书重签，所以这里用自签证书即可（只要 Subject 等于 Publisher）。
#
# 需要仓库变量（Settings → Secrets and variables → Actions → Variables）:
#   MSIX_IDENTITY_NAME           Partner Center 的“包名称”，如 Refout.25zai
#   MSIX_PUBLISHER               Partner Center 的 Publisher，如 CN=1A2B...
#   MSIX_PUBLISHER_DISPLAY_NAME  显示名，如 refout
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本（不带 v；留空取 Cargo.toml）"
        required: false

jobs:
  msix:
    runs-on: windows-latest
    env:
      IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
      INPUT_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 检查仓库变量
        shell: pwsh
        run: |
          if (-not $env:IDENTITY_NAME -or -not $env:PUBLISHER -or -not $env:PUBLISHER_DISPLAY_NAME) {
            throw "缺少仓库变量 MSIX_IDENTITY_NAME / MSIX_PUBLISHER / MSIX_PUBLISHER_DISPLAY_NAME"
          }

      - name: build
        run: cargo build --release -p erwuzai-ui

      - name: 打包 MSIX
        shell: pwsh
        run: |
          $v = $env:INPUT_VERSION
          if (-not $v) {
            $line = Select-String -Path 'crates/erwuzai-ui/Cargo.toml' -Pattern '^version = "(.+)"' | Select-Object -First 1
            $v = $line.Matches[0].Groups[1].Value
          }
          ./packaging/msix/pack.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME -Version $v

      - name: 签名
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist/*.msix | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PUBLISHER -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(2)
          $pwd = ConvertTo-SecureString 'store' -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $sdk = Get-ChildItem (Join-Path $pf86 'Windows Kits/10/bin') -Directory | Where-Object { $_.Name -match '^[0-9]+[.]' } | Sort-Object Name -Descending | Select-Object -First 1
          & (Join-Path $sdk.FullName 'x64/signtool.exe') sign /fd SHA256 /f $pfx /p store $msix.FullName
          Write-Host ("已签名: " + $msix.FullName)

      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix
          if-no-files-found: error
