name: release

# 打 tag 触发：git tag v0.1.0 && git push origin v0.1.0
# workflow_dispatch 只出 artifact，不建 Release，用来验证打包脚本。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 打包前先跑测试：发出去的包必须是通过测试的那一份。
      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --release --locked -p erwuzai-ui

      - name: package
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "dev-${{ github.sha }}".Substring(0, 12) }
          # Inno 的 AppVersion 只接受数字点分，dev 构建统一报 0.0.0，版本信息靠文件名区分。
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" -replace '^v', '' } else { '0.0.0' }
          $name = "25zai-$tag-windows-x64"

          # 绿色版：解压即用
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/release/25zai.exe" "dist/$name/"
          Copy-Item "README.md", "LICENSE" "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"

          # 安装包：同一个 exe，多一层开始菜单 / 开机自启 / 卸载
          New-Item -ItemType Directory -Force -Path "dist/stage" | Out-Null
          Copy-Item "dist/$name/*" "dist/stage/"
          choco install innosetup --no-progress -y | Out-Null
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "找不到 ISCC.exe" }
          & $iscc "/DAppVersion=$version" "/DOutputBase=$name-setup" ".github/installer/25zai.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC 失败（退出码 $LASTEXITCODE）" }

          "PKG_NAME=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # 上架 Microsoft Store 用的 MSIX：和 exe 一起随 Release 发布，
      # 上传 Partner Center 时直接从这里下载。
      - name: 打包 MSIX
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          if (-not $env:IDENTITY_NAME -or -not $env:PUBLISHER -or -not $env:PUBLISHER_DISPLAY_NAME) {
            throw "缺少仓库变量 MSIX_IDENTITY_NAME / MSIX_PUBLISHER / MSIX_PUBLISHER_DISPLAY_NAME"
          }
          if ($env:PUBLISHER -match '^CN=0{8}-0{4}-0{4}-0{4}-0{12}') {
            throw "MSIX_PUBLISHER 仍是占位值。去 Partner Center → 产品管理 → 产品标识复制 Publisher。"
          }
          ./packaging/msix/pack.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME -Version $env:PKG_VERSION

      # Store 上传不需要签名（微软会重签），自签只是让包能被 sideload 验证。
      - name: 签名 MSIX
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
        run: |
          $msix = Get-ChildItem dist/*.msix | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $env:PUBLISHER -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(2)
          $pwd = ConvertTo-SecureString 'store' -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $sdk = Get-ChildItem (Join-Path $pf86 'Windows Kits/10/bin') -Directory |
            Where-Object { $_.Name -match '^[0-9]+[.]' } | Sort-Object Name -Descending | Select-Object -First 1
          & (Join-Path $sdk.FullName 'x64/signtool.exe') sign /fd SHA256 /f $pfx /p store $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool 失败（$LASTEXITCODE）" }

      - name: 校验和
        shell: pwsh
        run: |
          $sums = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msix' } | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name
          }
          $sums | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msix
            dist/SHA256SUMS.txt
          if-no-files-found: error

      # 用 PAT 建 Release：GITHUB_TOKEN 建出来的 Release 不会再触发别的 workflow，
      # winget.yml 的 release: published 就会永远等不到。没配 PAT 时退回默认 token（只是不自动发 winget）。
      - name: publish
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.WINGET_TOKEN || github.token }}
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msix
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
